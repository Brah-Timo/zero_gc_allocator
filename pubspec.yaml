name: zero_gc_allocator
description: >
  Ultra-high-performance manual memory management for Dart/Flutter using FFI, offering arena, pool, and slab allocators outside the Dart GC for zero GC pressure and deterministic O(1) allocation latency in latency-critical systems.

version: 1.0.0
homepage: https://github.com/Brah-Timo/zero_gc_allocator
repository: https://github.com/Brah-Timo/zero_gc_allocator
issue_tracker: https://github.com/Brah-Timo/zero_gc_allocator/issues
documentation: https://pub.dev/documentation/zero_gc_allocator/latest/

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.24.0
  benchmark_harness: ^2.2.0
  lints: ^3.0.0

topics:
  - ffi
  - memory
  - performance
  - native
  - allocator

platforms:
  android:
  ios:
  linux:
  macos:
  windows:
